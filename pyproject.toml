[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "module_olist"
version = "0.0.1"
description = "Brazilian E-Commerce Public Dataset"
authors = [
  { name = "Th1agoChaves" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "fg-data-profiling>=4.20.0",
    "ipython",
    "ipywidgets>=8.1.9",
    "jupyterlab",
    "loguru",
    "matplotlib",
    "mkdocs",
    "notebook",
    "numpy",
    "pandas",
    "pandera>=0.34.1",
    "pip",
    "pytest",
    "python-dotenv",
    "ruff",
    "scikit-learn",
    "tqdm",
    "typer",
]
requires-python = ">=3.12,<3.13"


[tool.ruff]
line-length = 99
src = ["module_olist"]
include = ["pyproject.toml", "module_olist/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["module_olist"]
force-sort-within-sections = true

